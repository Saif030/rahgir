# Production / Docker deployment (requires Docker; not needed for local SQLite dev)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventroute
      POSTGRES_PASSWORD: eventroute
      POSTGRES_DB: eventroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
